    name: Current setting reported
    category: diagnostic
    dps:
      - id: 150
        type: integer
        optional: true
        name: sensor
      - id: 107
        type: json
        optional: true
        name: allowed_values
      - id: 152
        type: integer
        optional: true
        name: raw_dp152
      - id: 157
        type: integer
        optional: true
        name: raw_dp157
  - entity: sensor
    name: Schedule configuration
    category: diagnostic
    dps:
      - id: 151
        type: json
        optional: true
        name: sensor
  - entity: sensor
    name: Language
    category: diagnostic
    dps:
      - id: 153
        type: string
        optional: true
        name: sensor
  - entity: binary_sensor
    name: Diagnostic flag DP154
    category: diagnostic
    dps:
      - id: 154
        type: boolean
        optional: true
