    name: Charging status
    icon: "mdi:ev-station"
    dps:
      - id: 109
        type: string
        name: sensor
        # Preserve firmware status verbatim; STATE_C is not proof of power draw.
      - id: 102
        type: json
        name: telemetry
      - id: 117
        type: json
        optional: true
        name: electrical_measurements
      - id: 101
        type: integer
        optional: true
        name: state_code
      - id: 106
        type: json
        optional: true
        name: device_information
