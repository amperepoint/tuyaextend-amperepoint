# Ampere Point Wallbox PRIME — split DP102/DP117 firmware.
# Read-only baseline captured with an EVSE tester, no load (2026-09-11).
# Keep separate from the earlier PRIME profile: DP154 is boolean here.
# No controls and no RFID/card datapoints are exposed.
name: Ampere Point Wallbox PRIME (local)
products:
  - id: 3tajnmwugclfmotb
    manufacturer: Ampere Point
    model: Wallbox PRIME (local)
entities:
