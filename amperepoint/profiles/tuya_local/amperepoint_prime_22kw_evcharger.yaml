# Canonical tuya-local profile for Wallbox Prime 22kW.
#
# Product ID: gbmxngploofmhbjc
# Protocol: Tuya LAN 3.5
#
# Installation - all five steps are required:
#   1. Copy this file into config/custom_components/tuya_local/devices/.
#   2. Restart Home Assistant so tuya-local loads the new profile.
#   3. DELETE any existing tuya-local entry for this charger. tuya-local can
#      only choose a device profile while ADDING a device; its "Configure"
#      dialog offers local key, host, protocol and poll-only, never the
#      device type, so an entry created with a wrong profile cannot be
#      repointed at this one.
#   4. Add integration -> Tuya Local -> enter device id, IP, local key and
#      protocol version 3.5 (the connection must succeed; on failure the flow
#      re-renders the credentials form and never reaches profile selection).
#   5. In the device-type step choose
#      "Ampere Point Wallbox Prime 22kW (amperepoint_prime_22kw_evcharger)".
#      The list is sorted by match quality, not alphabetically.
#
# Design notes - why this profile is deliberately small:
#
# tuya-local excludes a profile from the device-type list entirely when any
# declared datapoint is missing from the device response (unless the datapoint
# is optional) or when any declared datapoint that IS present has a different
# type than declared - see helpers/device_config.py, TuyaDeviceConfig.matches.
# A charger that answers with only part of its datapoints during the config
# flow would therefore hide a profile that declares all fourteen of them.
#
# Every datapoint below is optional so the profile always remains selectable,
# and only the datapoints the AmperePoint integration consumes are declared,
# so undocumented value types cannot disqualify the whole profile. The
# remaining datapoints (103, 106, 107, 108, 151-157, 188) are documented in
# amperepoint/docs/product-gbmxngploofmhbjc-ampere-point-prime-22kw.md and can
# be added once their wire types are confirmed from a "LOCAL DPS:" log line.
#
# A HACS update of tuya-local can remove files from its devices/ directory;
# re-copy this profile and repeat steps 2-5 if the charger stops working
# after such an update.

---

name: Ampere Point Wallbox Prime 22kW
products:
  - id: gbmxngploofmhbjc
    manufacturer: Ampere Point
    model: Wallbox Prime 22kW

entities:
  - entity: sensor
    name: Charging status
    icon: "mdi:ev-station"
    class: enum
    dps:
      - id: 109
        type: string
        optional: true
        name: sensor
        mapping:
          - dps_val: SLEEP
            value: sleep
          - dps_val: IDLE
            value: idle
          - dps_val: WORKING
            value: charging
      # DP102 carries the live telemetry payload the AmperePoint integration
      # decodes (voltage, current, power, energy, temperature, control pilot
      # and session duration). tuya-local delivers a json datapoint as a
      # string; the integration accepts both a JSON string and a mapping.
      - id: 102
        type: json
        optional: true
        name: telemetry
      - id: 101
        type: integer
        optional: true
        name: state_code

  - entity: sensor
    name: Current limit
    icon: "mdi:current-ac"
    class: current
    category: diagnostic
    dps:
      - id: 150
        type: integer
        optional: true
        name: sensor
        unit: A
