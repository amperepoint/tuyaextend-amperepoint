# Canonical tuya-local profile for Wallbox Prime 22kW.
#
# Product ID: gbmxngploofmhbjc
# Protocol: Tuya LAN 3.5
#
# Installation - all five steps are required:
#   1. Copy this file into config/custom_components/tuya_local/devices/.
#   2. Restart Home Assistant so tuya-local loads the new profile.
#   3. DELETE any existing tuya-local entry for this charger. tuya-local can
#      only choose a device profile while ADDING a device; its "Configure"
#      dialog offers local key, host, protocol and poll-only, never the
#      device type, so an entry created with a wrong profile cannot be
#      repointed at this one.
#   4. Add integration -> Tuya Local -> enter device id, IP, local key and
#      protocol version 3.5 (the connection must succeed; on failure the flow
#      re-renders the credentials form and never reaches profile selection).
#   5. In the device-type step choose
#      "Ampere Point Wallbox Prime 22kW (amperepoint_prime_22kw_evcharger)".
#
# A HACS update of tuya-local can remove files from its devices/ directory;
# re-copy this profile and repeat steps 2-5 if the charger stops working
# after such an update.

---

name: EV charger
products:
  - id: gbmxngploofmhbjc
    manufacturer: Ampere Point
    model: Wallbox Prime 22kW

entities:
  - entity: sensor
    name: Charging status
    icon: "mdi:ev-station"
    class: enum
    dps:
      - id: 109
        type: string
        name: sensor
        mapping:
          - dps_val: SLEEP
            value: sleep
          - dps_val: IDLE
            value: idle
          - dps_val: WORKING
            value: charging
      - id: 101
        type: integer
        name: state_code
      - id: 102
        type: json
        name: telemetry
      - id: 103
        type: json
        optional: true
        name: session_data
      - id: 106
        type: json
        name: device_information

  - entity: sensor
    name: Current limit
    icon: "mdi:current-ac"
    class: current
    category: diagnostic
    dps:
      - id: 150
        type: integer
        name: sensor
        unit: A
      - id: 107
        type: json
        name: allowed_values
      - id: 152
        type: integer
        name: maximum_value
      - id: 157
        type: integer
        name: minimum_value

  - entity: sensor
    name: Schedule configuration
    category: diagnostic
    dps:
      - id: 151
        type: json
        name: sensor

  - entity: sensor
    name: Language
    class: enum
    category: diagnostic
    dps:
      - id: 153
        type: string
        name: sensor

  - entity: binary_sensor
    name: Unknown setting
    category: diagnostic
    dps:
      - id: 155
        type: boolean
        name: sensor

  - entity: sensor
    name: Raw diagnostics
    category: diagnostic
    hidden: true
    dps:
      # tuya-local raises "is missing a sensor dps" unless one dps is named
      # "sensor"; the remaining ones are exposed as attributes.
      - id: 108
        type: integer
        name: sensor
      - id: 154
        type: integer
        name: dp_154
      - id: 188
        type: boolean
        optional: true
        name: dp_188
