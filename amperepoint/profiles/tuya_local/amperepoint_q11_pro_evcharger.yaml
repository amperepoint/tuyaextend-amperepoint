# Canonical tuya-local profile for Ampere Point Q11 PRO (11 kW Q Series).
#
# Protocol: Tuya LAN 3.5
#
# Installation - all five steps are required:
#   1. Copy this file into config/custom_components/tuya_local/devices/.
#   2. Restart Home Assistant so tuya-local loads the new profile.
#   3. DELETE any existing tuya-local entry for this charger. tuya-local can
#      only choose a device profile while ADDING a device; its "Configure"
#      dialog never offers the device type, so an entry created with a wrong
#      profile (for example the third-party aimiler_11kW_evcharger, which
#      matches the same datapoints but names and scales them differently)
#      cannot be repointed at this one.
#   4. Add integration -> Tuya Local -> enter device id, IP, local key and
#      protocol version 3.5.
#   5. In the device-type step choose
#      "Ampere Point Q11 PRO (amperepoint_q11_pro_evcharger)".
#
# Datapoint types are taken from a real "LOCAL DPS:" capture logged by
# tuya-local during the device-type step on 2026-07-25, with the charger
# free and idle:
#
#   {"3": "charger_free", "4": 8, "9": 0, "10": 0, "13": "controlpi_12v",
#    "14": "charge_now", "18": true, "24": 25}
#
# The unit answered with eight datapoints only: no session meter (DP1), no
# target energy (DP17), no last-session counter (DP25) and no phase payloads
# (DP6/7/8). Those are declared as optional so units that do report them are
# still covered, and so a partial response can never hide this profile from
# the device-type list - see the note in
# amperepoint/profiles/tuya_local/amperepoint_prime_22kw_evcharger.yaml.
#
# A Q37 (product id fdfjiphjxtc9qyhd, 3.7 kW, single-phase, 16 A) was
# captured on 2026-07-26 while paired with this profile and answered
# identically:
#
#   {"3": "charger_free", "4": 16, "9": 0, "10": 0, "13": "controlpi_12v",
#    "14": "charge_now", "18": true, "24": 28}
#
# Charging added DP1, DP6, DP7 and DP8 and confirmed two things that decide
# whether one profile can serve the whole series:
#   - DP9 is watts here too (1533 W next to L1 219.0 V x 7.2 A), so the
#     scale below holds across generations.
#   - DP1 carries energy, but not the same energy on every generation. On
#     the Q37 it restarts from zero for each session, with DP25 taking the
#     value the ended session finished with. On the Q11 it read 42.10 kWh
#     with the charger idle and no session running, which is a lifetime
#     meter. total_increasing is correct either way: it is the class meant
#     for a counter that may reset, and Home Assistant accumulates the
#     long-term statistic across the resets.
# See amperepoint/docs/device-q37-ve-lan-capture.md for the full log.
#
# A Q22 (22 kW, 32 A, three-phase) was captured on 2026-07-26 and answered
# with the same eight datapoints again, and with the same product id as the
# Q37:
#
#   {"3": "charger_free", "4": 6, "9": 0, "10": 0, "13": "controlpi_12v",
#    "14": "charge_now", "18": true, "24": 23}
#
# That settles the question of whether one profile can pick the current range
# on its own: it cannot. tuya-local can vary a range through a `maximum` dps
# or a mapping condition, but both need a datapoint whose value differs
# between generations, and there is none - not even the product id, which a
# 16 A single-phase Q37 and a 32 A three-phase Q22 share. The range below is
# therefore the union, narrowed by the integration from the detected model.
#
# The Q11 has no confirmed product id and is matched on its datapoints
# alone. So the two datapoints present in every measured response of every
# unit so far (status DP3 and current setting DP4) are kept required.
# Without that small signature an all-optional profile also matches unrelated
# Tuya devices that share none of the charger's datapoints - a thermostat and
# a temperature sensor both came back as matches while it was fully optional.
# Any further generation added here has to report DP3 and DP4 as well.

---

name: Ampere Point EV Charger (local)
products:
  # One entry only, so the device-type list shows one row for the series
  # instead of one per model. tuya-local builds that row from manufacturer +
  # model, and writes the same model string into the device - which the
  # integration reads to decide phase count and current limit. Naming models
  # here ("Q37, Q74, Q11, Q22") would therefore make every charger detect as
  # whichever one is checked first. The row says what it covers without
  # spelling out numbers that double as model aliases.
  #
  # Two Tuya products so far. Both entries carry the same manufacturer and
  # model, and tuya-local shows distinct pairs only, so the list still has a
  # single row. A product id that no profile declares makes tuya-local fall
  # back to the `name:` field for every row in the list, which is why these
  # ids matter for presentation and not only for match quality.
  #
  # fdfjiphjxtc9qyhd covers both the Q37 and the Q22 - Tuya sells them as one
  # product. jhlyzpk5nfk28nrh is the Q11 PRO.
  - id: fdfjiphjxtc9qyhd
    manufacturer: Ampere Point
    model: Q Series - all models (local)
  - id: jhlyzpk5nfk28nrh
    manufacturer: Ampere Point
    model: Q Series - all models (local)

entities:
  - entity: sensor
    name: Charging status
    icon: "mdi:ev-station"
    class: enum
    dps:
      - id: 3
        type: string
        name: sensor
        mapping:
          - dps_val: charger_charging
            value: charging
          - dps_val: charger_free
            value: available
          - dps_val: charger_insert
            value: plugged_in
          - dps_val: charger_free_fault
            value: fault_unplugged
          - dps_val: charger_wait
            value: waiting
          - dps_val: charger_pause
            value: paused
          - dps_val: charger_end
            value: charged
          - dps_val: charger_fault
            value: fault
      - id: 23
        force: true
        type: string
        optional: true
        name: system_version

  - entity: sensor
    name: Vehicle connection state
    icon: "mdi:car-electric"
    class: enum
    dps:
      - id: 13
        type: string
        optional: true
        name: sensor
        # Measured by stepping a test rig through every Control Pilot state:
        # controlpi_6v is reported both at full load and with the charge
        # stopped at 0 A, so it means the vehicle signals state C, not that
        # energy is flowing. DP3 and DP18 say whether it flows. No _pwm
        # variant appeared in any state on this generation.
        mapping:
          - dps_val: controlpi_12v
            value: standby
          - dps_val: controlpi_9v
            value: vehicle_detected
          - dps_val: controlpi_6v
            value: ready_to_charge
          - dps_val: controlpi_error
            value: fault

  - entity: switch
    name: Charging
    icon: "mdi:ev-station"
    dps:
      - id: 18
        type: boolean
        optional: true
        name: switch

  - entity: number
    name: Charging current
    icon: "mdi:current-ac"
    class: current
    category: config
    dps:
      # The series names are kilowatts, not amperes, and the current limit
      # splits the range in two: Q11 and Q37 stop at 16 A, Q22 and Q74 go to
      # 32 A. Nothing in the LAN response tells them apart - a Q22 answers
      # with the same eight datapoints as a Q37 and reports the same product
      # id - so this range is the union of the series, 6-32 A.
      #
      # The AmperePoint integration narrows its own slider to the limits of
      # the detected model, so a 16 A charger still stops at 16 A. The
      # narrowing can only ever reduce this bound, never raise it, so the
      # worst case of a failed detection is 32 A offered on the series
      # maximum rather than an out-of-range value.
      - id: 4
        type: integer
        name: value
        unit: A
        range:
          min: 6
          max: 32

  - entity: select
    name: Charging mode
    category: config
    dps:
      - id: 14
        type: string
        optional: true
        name: option
        mapping:
          - dps_val: charge_now
            value: immediate
          - dps_val: charge_energy
            value: fixed_charge
          - dps_val: charge_schedule
            value: scheduled_charge

  - entity: sensor
    name: Power
    class: power
    dps:
      # The charger reports total power in watts, the same unit the phase
      # payload uses: 1606 W alongside L1 at 220.0 V and 7.3 A.
      - id: 9
        type: integer
        optional: true
        name: sensor
        unit: kW
        class: measurement
        mapping:
          - scale: 1000

  - entity: sensor
    name: Temperature
    class: temperature
    category: diagnostic
    dps:
      - id: 24
        type: integer
        optional: true
        name: sensor
        unit: C
        class: measurement

  - entity: sensor
    name: Fault
    icon: "mdi:alert-circle-outline"
    category: diagnostic
    class: enum
    dps:
      - id: 10
        type: bitfield
        optional: true
        name: sensor

  # Packed phase payloads. tuya-local slices the base64 bytes with "mask",
  # so each reading becomes its own entity instead of one opaque blob.
  - entity: sensor
    name: Voltage L1
    class: voltage
    category: diagnostic
    dps:
      - id: 6
        force: true
        type: base64
        optional: true
        name: sensor
        unit: V
        mask: "FFFF0000000000"
        mapping:
          - scale: 10

  - entity: sensor
    name: Current L1
    class: current
    category: diagnostic
    dps:
      - id: 6
        force: true
        type: base64
        optional: true
        name: sensor
        unit: A
        mask: "0000FFFFFF0000"
        mapping:
          - scale: 1000

  - entity: sensor
    name: Power L1
    class: power
    category: diagnostic
    dps:
      - id: 6
        force: true
        type: base64
        optional: true
        name: sensor
        unit: kW
        mask: "0000000000FFFF"
        mapping:
          - scale: 1000

  - entity: sensor
    name: Voltage L2
    class: voltage
    category: diagnostic
    dps:
      - id: 7
        force: true
        type: base64
        optional: true
        name: sensor
        unit: V
        mask: "FFFF0000000000"
        mapping:
          - scale: 10

  - entity: sensor
    name: Current L2
    class: current
    category: diagnostic
    dps:
      - id: 7
        force: true
        type: base64
        optional: true
        name: sensor
        unit: A
        mask: "0000FFFFFF0000"
        mapping:
          - scale: 1000

  - entity: sensor
    name: Power L2
    class: power
    category: diagnostic
    dps:
      - id: 7
        force: true
        type: base64
        optional: true
        name: sensor
        unit: kW
        mask: "0000000000FFFF"
        mapping:
          - scale: 1000

  - entity: sensor
    name: Voltage L3
    class: voltage
    category: diagnostic
    dps:
      - id: 8
        force: true
        type: base64
        optional: true
        name: sensor
        unit: V
        mask: "FFFF0000000000"
        mapping:
          - scale: 10

  - entity: sensor
    name: Current L3
    class: current
    category: diagnostic
    dps:
      - id: 8
        force: true
        type: base64
        optional: true
        name: sensor
        unit: A
        mask: "0000FFFFFF0000"
        mapping:
          - scale: 1000

  - entity: sensor
    name: Power L3
    class: power
    category: diagnostic
    dps:
      - id: 8
        force: true
        type: base64
        optional: true
        name: sensor
        unit: kW
        mask: "0000000000FFFF"
        mapping:
          - scale: 1000

  - entity: sensor
    name: Schedule payload
    category: diagnostic
    hidden: true
    dps:
      - id: 19
        force: true
        type: base64
        optional: true
        name: sensor

  - entity: sensor
    name: Charge mode payload
    category: diagnostic
    hidden: true
    dps:
      - id: 33
        force: true
        type: base64
        optional: true
        name: sensor

  # Datapoints absent from the first captures, kept for other Q Series units.
  # DP1 turned out to hold the current session rather than a lifetime total;
  # the entity name is left alone for now so existing installations keep
  # their entity ids.
  - entity: sensor
    name: Total energy
    class: energy
    category: diagnostic
    dps:
      - id: 1
        force: true
        type: integer
        optional: true
        name: sensor
        unit: kWh
        class: total_increasing
        mapping:
          - scale: 100

  - entity: number
    name: Target energy
    icon: "mdi:battery-charging-high"
    category: config
    dps:
      - id: 17
        force: true
        type: integer
        optional: true
        name: value
        unit: kWh
        range:
          min: 0
          max: 200

  - entity: sensor
    name: Last session energy
    class: energy
    category: diagnostic
    dps:
      - id: 25
        force: true
        type: integer
        optional: true
        name: sensor
        unit: kWh
        mapping:
          - scale: 100
