name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Run Python tests
        run: python -m unittest discover -s tests

      - name: Check Python syntax
        run: python -m compileall -q custom_components tests

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Run frontend tests
        run: node --test tests/test_frontend_device_selector.mjs

      - name: Check frontend syntax
        run: node --check custom_components/tuyaextend_amperepoint/frontend/amperepoint-q22-card.js

  energy-home-assistant:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Test real HA sensors, storage and Recorder with synthetic data
        run: |
          docker network create --internal amperepoint-energy-smoke
          docker run --rm --network amperepoint-energy-smoke \
            --mount "type=bind,source=${{ github.workspace }},target=/work,readonly" \
            --entrypoint python ghcr.io/home-assistant/home-assistant:2026.7.2 \
            /work/tests/ha_energy_smoke.py

      - name: Remove isolated test network
        if: always()
        run: docker network rm amperepoint-energy-smoke
