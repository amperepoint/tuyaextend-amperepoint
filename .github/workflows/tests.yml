name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Run Python tests
        run: python -m unittest discover -s tests

      - name: Check Python syntax
        run: python -m compileall -q custom_components tests

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run frontend tests
        run: node --test tests/test_frontend_device_selector.mjs

      - name: Check frontend syntax
        run: node --check custom_components/tuyaextend_amperepoint/frontend/amperepoint-q22-card.js
